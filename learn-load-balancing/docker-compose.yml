services:
  server1:
    build: ./server1
    environment:
      SERVER_NAME: server1
    ports:
      - "3001:3000" # direct access, for comparison

  server2:
    build: ./server2
    environment:
      SERVER_NAME: server2
    ports:
      - "3002:3000"

  server3:
    build: ./server3
    environment:
      SERVER_NAME: server3
    ports:
      - "3003:3000"

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server1
      - server2
      - server3

  nginx-exporter:
    image: docker.io/nginx/nginx-prometheus-exporter:latest
    command: --nginx.scrape-uri=http://nginx:80/stub_status
    depends_on:
      - nginx

  prometheus:
    image: docker.io/prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: docker.io/grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
