events {
  worker_connections 1024;
}

http {
  # Log which backend actually served the request.
  log_format lb '$remote_addr - "$request" status=$status '
                'upstream=$upstream_addr upstream_time=$upstream_response_time';
  access_log /dev/stdout lb;
 limit_req_zone  $binary_remote_addr zone=perip:10m rate=5000r/s;
 limit_conn_zone $binary_remote_addr zone=conns:10m;

 limit_req_status  429;
 limit_conn_status 429;
  upstream backend {
    # Default algorithm is round-robin. Swap in one of these to experiment:
      least_conn;          # send to the backend with fewest active connections
    #   ip_hash;             # sticky sessions by client IP
    #   hash $request_uri;   # sticky by URL

    server server1:3000 max_fails=2 fail_timeout=10s max_conns=10;
    server server2:3000 max_fails=2 fail_timeout=10s max_conns=10;
    server server3:3000 max_fails=2 fail_timeout=10s max_conns=10;

    # Add "weight=3" to a server above to send it more traffic.
    # Add "backup" to keep a server idle until the others are down.

    keepalive 32;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

      # Retry the next backend when one fails or returns 5xx.
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_connect_timeout 2s;

      limit_req  zone=perip burst=200 nodelay;
        limit_conn conns 100;
    }

    location /nginx-health {
      return 200 "nginx is still alive!";
    }

    # Outside "location /" on purpose, so monitoring never gets rate-limited.
    location /stub_status {
      stub_status;
      access_log off;
    }
  }
}
